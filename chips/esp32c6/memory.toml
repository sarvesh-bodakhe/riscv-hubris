# ESP32-C6, SRAM-resident image: the boot ROM's loader copies the image's
# segments into HP SRAM (0x4080_0000, 512 KiB, one window for
# instructions and data) and jumps to the entry point. "flash" is the
# executable part of that SRAM; nothing executes in place from the flash
# chip in this minimal configuration.

[[flash]]
address = 0x40800000
size = 131072
read = true
execute = true

[[ram]]
address = 0x40820000
size = 262144
read = true
write = true
execute = false
