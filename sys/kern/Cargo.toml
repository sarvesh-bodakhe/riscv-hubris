[package]
name = "kern"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = { workspace = true }
byteorder = { workspace = true }
cfg-if = { workspace = true }
serde = { workspace = true }
ssmarshal = { workspace = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }

abi = { path = "../abi" }
phash = { path = "../../lib/phash" }
unwrap-lite = { path = "../../lib/unwrap-lite" }
kerncore.path = "../kerncore"

# These crates contain ARM inline assembly and only build for ARM targets;
# they are only used from arch/arm_m.rs.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { workspace = true }
armv8-m-mpu = { path = "../../lib/armv8-m-mpu" }

[build-dependencies]
anyhow = { workspace = true }
indexmap = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
syn = { workspace = true }

abi = { path = "../abi" }
build-kconfig = { path = "../../build/kconfig" }
build-util = { path = "../../build/util" }
call_rustfmt = { path = "../../build/call_rustfmt" }
phash-gen = { path = "../../build/phash-gen" }

[features]
dump = []
nano = []
# RISC-V chip support selection (see src/arch/riscv32.rs): a riscv32
# build must enable exactly one, via [kernel] features in the app.toml.
esp32c6 = []

[lib]
test = false
doctest = false
bench = false

[lints]
workspace = true
